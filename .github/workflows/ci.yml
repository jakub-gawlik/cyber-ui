name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test

  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [react, vue]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # pack the library and build the smoke app against the tarball —
      # catches packaging regressions (exports map, sideEffects, missing files)
      - run: npm run pack:smoke
      - run: |
          cd smoke/${{ matrix.app }}
          npm install
          npm run build
